spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/reservation/**,/api/reservation
spring.cloud.gateway.server.webflux.routes[3].filters[0]=StripPrefix=2
spring.cloud.gateway.server.webflux.routes[8].id=reservation-service-legacy
spring.cloud.gateway.server.webflux.routes[8].uri=${RESERVATION_SERVICE_URI:lb://reservation-service}
spring.cloud.gateway.server.webflux.routes[8].predicates[0]=Path=/reservation/**
spring.cloud.gateway.server.webflux.routes[8].filters[0]=StripPrefix=1

spring.cloud.gateway.server.webflux.routes[4].id=notification-service
spring.cloud.gateway.server.webflux.routes[4].uri=${NOTIFICATION_SERVICE_URI:lb://notification-service}
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/api/notification/**,/api/notification
spring.cloud.gateway.server.webflux.routes[4].filters[0]=StripPrefix=2
spring.cloud.gateway.server.webflux.routes[9].id=notification-service-legacy
