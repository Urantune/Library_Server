spring.application.name=api-gateway
server.port=${SERVER_PORT:8080}
spring.profiles.default=local
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.metrics.tags.application=${spring.application.name}
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${server.port}
eureka.client.healthcheck.enabled=true

spring.cloud.gateway.server.webflux.routes[0].id=identity-service
spring.cloud.gateway.server.webflux.routes[0].uri=${IDENTITY_SERVICE_URI:lb://identity-service}
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/identity/**,/api/identity
spring.cloud.gateway.server.webflux.routes[0].filters[0]=StripPrefix=2
spring.cloud.gateway.server.webflux.routes[5].id=identity-service-legacy
spring.cloud.gateway.server.webflux.routes[5].uri=${IDENTITY_SERVICE_URI:lb://identity-service}
spring.cloud.gateway.server.webflux.routes[5].predicates[0]=Path=/identity/**
spring.cloud.gateway.server.webflux.routes[5].filters[0]=StripPrefix=1

spring.cloud.gateway.server.webflux.routes[1].id=catalog-service
spring.cloud.gateway.server.webflux.routes[1].uri=${CATALOG_SERVICE_URI:lb://catalog-service}
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/catalog/**,/api/catalog
spring.cloud.gateway.server.webflux.routes[1].filters[0]=StripPrefix=2
spring.cloud.gateway.server.webflux.routes[6].id=catalog-service-legacy
spring.cloud.gateway.server.webflux.routes[6].uri=${CATALOG_SERVICE_URI:lb://catalog-service}
spring.cloud.gateway.server.webflux.routes[6].predicates[0]=Path=/catalog/**
spring.cloud.gateway.server.webflux.routes[6].filters[0]=StripPrefix=1

