spring.cloud.gateway.server.webflux.routes[2].filters[0]=StripPrefix=2
spring.cloud.gateway.server.webflux.routes[7].id=circulation-service-legacy
spring.cloud.gateway.server.webflux.routes[7].uri=${CIRCULATION_SERVICE_URI:lb://circulation-service}
spring.cloud.gateway.server.webflux.routes[7].predicates[0]=Path=/circulation/**
spring.cloud.gateway.server.webflux.routes[7].filters[0]=StripPrefix=1

spring.cloud.gateway.server.webflux.routes[3].id=reservation-service
