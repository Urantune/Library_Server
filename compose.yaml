name: library-server
x-app: &app
  restart: unless-stopped
  environment: &env
    SPRING_PROFILES_ACTIVE: docker
    EUREKA_URL: http://discovery-service:8761/eureka/
    REDIS_HOST: redis
    REDIS_PORT: 6379
    KAFKA_BOOTSTRAP_SERVERS: kafka:19092
  healthcheck: &health
    test: ["CMD-SHELL", "curl -fsS http://localhost:$${SERVER_PORT}/actuator/health/readiness || exit 1"]
    interval: 10s
    timeout: 5s
    retries: 12
    start_period: 60s
services:
  redis:
    image: redis:7.4.2-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["127.0.0.1:6379:6379"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
  kafka:
    image: apache/kafka:3.9.1
    ports: ["127.0.0.1:9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes: ["kafka-data:/var/lib/kafka/data"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:19092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
  kafka-init:
    image: apache/kafka:3.9.1
    depends_on:
      kafka: {condition: service_healthy}
    entrypoint: ["/bin/bash", "-ec"]
    command:
      - |
        for topic in library.loan.approved.v1 library.loan.returned.v1 library.loan.overdue.v1 library.reservation.ready.v1; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists --topic "$$topic" --partitions 1 --replication-factor 1
        done
  discovery-service:
    <<: *app
    build:
      context: .
      args: {SERVICE: discovery-service}
    environment:
      <<: *env
      SERVER_PORT: 8761
    ports: ["127.0.0.1:8761:8761"]
  api-gateway:
    <<: *app
    build:
      context: .
      args: {SERVICE: api-gateway}
    environment:
      <<: *env
      SERVER_PORT: 8080
    ports: ["8080:8080"]
    depends_on:
      discovery-service: {condition: service_healthy}
  identity-service:
    <<: *app
    build:
      context: .
      args: {SERVICE: identity-service}
    environment:
      <<: *env
      SERVER_PORT: 8081
    volumes: ["identity-service-data:/app/data"]
    depends_on:
      discovery-service: {condition: service_healthy}
      redis: {condition: service_healthy}
      kafka-init: {condition: service_completed_successfully}
  catalog-service:
    <<: *app
    build:
      context: .
      args: {SERVICE: catalog-service}
    environment:
      <<: *env
      SERVER_PORT: 8082
    volumes: ["catalog-service-data:/app/data"]
    depends_on:
      discovery-service: {condition: service_healthy}
      redis: {condition: service_healthy}
      kafka-init: {condition: service_completed_successfully}
  circulation-service:
    <<: *app
    build:
      context: .
      args: {SERVICE: circulation-service}
    environment:
      <<: *env
      SERVER_PORT: 8083
    volumes: ["circulation-service-data:/app/data"]
    depends_on:
      discovery-service: {condition: service_healthy}
      redis: {condition: service_healthy}
      kafka-init: {condition: service_completed_successfully}
  reservation-service:
    <<: *app
    build:
      context: .
      args: {SERVICE: reservation-service}
    environment:
      <<: *env
      SERVER_PORT: 8084
    volumes: ["reservation-service-data:/app/data"]
    depends_on:
      discovery-service: {condition: service_healthy}
      redis: {condition: service_healthy}
      kafka-init: {condition: service_completed_successfully}
  notification-service:
    <<: *app
    build:
      context: .
      args: {SERVICE: notification-service}
    environment:
      <<: *env
      SERVER_PORT: 8085
    volumes: ["notification-service-data:/app/data"]
    depends_on:
      discovery-service: {condition: service_healthy}
      redis: {condition: service_healthy}
      kafka-init: {condition: service_completed_successfully}
volumes:
  redis-data:
  kafka-data:
  identity-service-data:
  catalog-service-data:
  circulation-service-data:
  reservation-service-data:
  notification-service-data:
