server.port=8081
spring.application.name=identity-service
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

spring.datasource.url=jdbc:sqlite:identity-service/data/identity.db
spring.datasource.driver-class-name=org.sqlite.JDBC

spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

spring.datasource.hikari.maximum-pool-size=1
spring.datasource.hikari.connection-init-sql=PRAGMA foreign_keys=ON
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# --- JWT tạm thời (bản dev, thay bằng cấu hình của Trọng khi merge auth chính thức) ---
security.jwt.private-key=classpath:keys/jwt-private.pem
security.jwt.issuer=library-identity
security.jwt.audience=library-api
security.jwt.access-ttl-seconds=900
security.jwt.refresh-ttl-days=7
